spring:
  main:
    web-application-type: none
    keep-alive: true
  application:
    name: device-comm
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  artemis:
    mode: native
    broker-url: ${ARTEMIS_URL:tcp://localhost:61616}
    user: ${ARTEMIS_USER:admin}
    password: ${ARTEMIS_PASSWORD:admin}

tracking:
  commands:
    gateway:
      # Private transport only. No public raw-command or hardware-control API is enabled.
      enabled: ${COMMAND_GATEWAY_ENABLED:false}
      host: ${COMMAND_GATEWAY_HOST:127.0.0.1}
      port: ${COMMAND_GATEWAY_PORT:8890}
      secret: ${COMMAND_CHANNEL_SECRET:}
      journal-directory: ${COMMAND_WRITE_JOURNAL_DIRECTORY:./data/command-writes}
      max-receipts: ${COMMAND_WRITE_MAX_RECEIPTS:10000}
  telemetry:
    spool:
      # A dedicated persistent, private filesystem volume is required in production.
      directory: ${TELEMETRY_SPOOL_DIRECTORY:./data/telemetry-spool}
      max-files: ${TELEMETRY_SPOOL_MAX_FILES:10000}
      max-bytes: ${TELEMETRY_SPOOL_MAX_BYTES:67108864}
      poll-delay-ms: ${TELEMETRY_SPOOL_POLL_DELAY_MS:1000}
  tcp:
    server:
      host: ${TCP_HOST:0.0.0.0}
      port: ${TCP_PORT:8888}
      max-pending-frames: ${TCP_MAX_PENDING_FRAMES:256}
      # Raw frames contain device IDs and coordinates; keep tracing off by default.
      wiretap-enabled: ${TCP_WIRETAP_ENABLED:false}

  phone:
    # Browser/phone tracking for live demos. Off by default. Plain HTTP here: browsers only allow geolocation on https
    # or http://localhost, so front it with TLS (or a tunnel for a real phone). See device-comm/PHONE-TRACKING.md.
    enabled: ${PHONE_INGEST_ENABLED:false}
    host: ${PHONE_INGEST_HOST:0.0.0.0}
    port: ${PHONE_INGEST_PORT:8891}
    # Shared with the core service, which issues pairing tokens. At least 32 bytes.
    pairing-secret: ${PHONE_PAIRING_SECRET:}
    max-accuracy-meters: ${PHONE_MAX_ACCURACY_METERS:100}
    read-timeout: ${PHONE_READ_TIMEOUT_SECONDS:120}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.surf.tracker.devicecomm: INFO
    com.surf.tracker.shared: INFO
